<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Transferencia</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  padding:60px;
  color:#000;
}

.title{
  text-align:center;
  margin-bottom:40px;
}

.title h1{
  font-size:26px;
  margin:0;
  letter-spacing:1px;
}

.header{
  display:flex;
  justify-content:space-between;
  margin-top:30px;
  margin-bottom:30px;
  font-size:16px;
}

.left, .right{
  line-height:1.8;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:25px;
}

th, td{
  border:2px solid #333;
  padding:10px;
  font-size:14px;
}

th{
  background:#efefef;
  font-weight:bold;
  text-align:center;
}

td{
  height:28px;
}

.signature{
  margin-top:90px;
  display:flex;
  justify-content:space-between;
}

.sign-box{
  width:45%;
  text-align:center;
  font-size:16px;
}

.line{
  margin-top:60px;
  border-top:2px solid #000;
  width:100%;
}
</style>
</head>

<body>

<div class="title">
  <h1>TRANSFERENCIA ENTRE ALMACENES</h1>
</div>

<div class="header">
  <div class="left">
    <strong>No. De Transferencia:</strong> {{transferNo}}<br/>
    <strong>Almacén origen:</strong> {{origin}}<br/>
    <strong>Almacén destino:</strong> {{destination}}
  </div>

  <div class="right">
    <strong>Fecha:</strong> {{date}}<br/>
    <strong>Usuario Origen:</strong> {{createdBy}}
  </div>
</div>

<table>
  <thead>
    <tr>
      <th style="width:120px;">Código</th>
      <th>Descripción / Referencia</th>
      <th style="width:160px;">Cantidad a transferir</th>
      <th style="width:160px;">Cantidad recibida</th>
      <th style="width:140px;">Diferencias</th>
    </tr>
  </thead>

  <tbody>
    {{rows}}
  </tbody>
</table>

<div class="signature">
  <div class="sign-box">
    Firma del Chofer
    <div class="line"></div>
  </div>

  <div class="sign-box">
    Recibido por
    <div class="line"></div>
  </div>
</div>

</body>
</html>
